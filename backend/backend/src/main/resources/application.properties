spring.application.name=backend
# ADDED: MySQL database connection
spring.datasource.url=jdbc:mysql://localhost:3306/ai_project_manager
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ADDED: Create/update tables from Java entities during development
spring.jpa.hibernate.ddl-auto=update

spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000
spring.mail.properties[mail.smtp.auth]=${APP_MAIL_SMTP_AUTH:true}
spring.mail.properties[mail.smtp.starttls.enable]=${APP_MAIL_STARTTLS:true}
spring.mail.properties[mail.smtp.starttls.required]=${APP_MAIL_STARTTLS:true}
